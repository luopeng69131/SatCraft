[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satcraft"
version = "0.2.0"
description = "Agentic scheduling policy optimization and satellite–cellular service simulation"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "SatCraft contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/luopeng69131/SatCraft"
Paper = "https://arxiv.org/abs/2610.29588"
Documentation = "https://github.com/luopeng69131/SatCraft/blob/main/docs/simulator.md"

[project.scripts]
satcraft = "satcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"satcraft.policies" = ["*.json"]
"satcraft.agent" = ["prompts/*.md"]
